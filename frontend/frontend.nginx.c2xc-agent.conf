server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Canonicalize trailing slash for base path.
  location = /c2xc-agent {
    return 301 /c2xc-agent/;
  }

  # Cache static assets aggressively (hashed by Vite).
  # IMPORTANT: this regex must appear BEFORE the generic assets regex below.
  location ~* ^/c2xc-agent/.*\.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
    rewrite ^/c2xc-agent/(.*)$ /$1 break;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    try_files $uri =404;
  }

  # SPA routing: serve index.html for unknown routes under /c2xc-agent/.
  location /c2xc-agent/ {
    rewrite ^/c2xc-agent/(.*)$ /$1 break;
    try_files $uri $uri/ /index.html;
  }

  # Root-mode (no prefix) support.
  # This keeps the image usable even when an upstream reverse-proxy strips /c2xc-agent.
  location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
